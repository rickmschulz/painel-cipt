<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão à Vista - CIPTC-ES</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            600: '#0284c7',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-slate-100 text-slate-800 font-sans antialiased flex flex-col min-h-screen">

    <!-- Navbar -->
    <div id="navbar-placeholder"></div>

    <div class="max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 mt-6">
        <a href="index.html" class="inline-flex items-center space-x-2 text-sm font-medium text-slate-500 hover:text-brand-600 transition-colors">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            <span>Voltar ao Painel Principal</span>
        </a>
    </div>

    <main class="max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-4 space-y-8 flex-grow">

        <section class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden max-w-3xl mx-auto">
            <div class="border-b border-slate-200 bg-slate-50 px-6 py-4 flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <i data-lucide="table-properties" class="w-5 h-5 text-brand-600"></i>
                    <h2 class="text-md font-semibold text-slate-800">Etapas Construtivas e Percentuais</h2>
                </div>
            </div>
            <div class="p-4 sm:p-6 bg-slate-50/50">
                <img src="./assets/PERCENTUAIS.jpg" alt="Etapas Construtivas e Percentuais" class="w-full h-auto rounded-lg border border-slate-200 shadow-sm">
            </div>
        </section>

        <section class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden max-w-3xl mx-auto">
            <div class="border-b border-slate-200 bg-slate-50 px-6 py-4 flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <i data-lucide="map" class="w-5 h-5 text-brand-600"></i>
                    <h2 class="text-md font-semibold text-slate-800">Mapeamento de Concretagem - Térreo</h2>
                </div>
            </div>
            <div class="p-4 sm:p-6 bg-slate-50/50">
                <img src="./assets/CONCRETAGEM – TÉRREO.jpg" alt="Mapeamento de Concretagem do Térreo" class="w-full h-auto rounded-lg border border-slate-200 shadow-sm">
            </div>
        </section>

        <section class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden max-w-3xl mx-auto">
            <div class="border-b border-slate-200 bg-slate-50 px-6 py-4 flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <i data-lucide="map" class="w-5 h-5 text-brand-600"></i>
                    <h2 class="text-md font-semibold text-slate-800">Mapeamento de Concretagem - 1º Pavimento</h2>
                </div>
            </div>
            <div class="p-4 sm:p-6 bg-slate-50/50">
                <img src="./assets/CONCRETAGEM – 1º PAVIMENTO.jpg" alt="Mapeamento de Concretagem do 1º Pavimento" class="w-full h-auto rounded-lg border border-slate-200 shadow-sm">
            </div>
        </section>

        <section class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden max-w-3xl mx-auto">
            <div class="border-b border-slate-200 bg-slate-50 px-6 py-4 flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <i data-lucide="map" class="w-5 h-5 text-brand-600"></i>
                    <h2 class="text-md font-semibold text-slate-800">Mapeamento de Concretagem - 2º Pavimento</h2>
                </div>
            </div>
            <div class="p-4 sm:p-6 bg-slate-50/50">
                <img src="./assets/CONCRETAGEM – 2º PAVIMENTO.jpg" alt="Documento 4" class="w-full h-auto rounded-lg border border-slate-200 shadow-sm">
            </div>
        </section>

        <section class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden max-w-3xl mx-auto">
            <div class="border-b border-slate-200 bg-slate-50 px-6 py-4 flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <i data-lucide="map" class="w-5 h-5 text-brand-600"></i>
                    <h2 class="text-md font-semibold text-slate-800">Mapeamento de Concretagem - 3º Pavimento</h2>
                </div>
            </div>
            <div class="p-4 sm:p-6 bg-slate-50/50">
                <img src="./assets/CONCRETAGEM – 3º PAVIMENTO.jpg" alt="Documento 5" class="w-full h-auto rounded-lg border border-slate-200 shadow-sm">
            </div>
        </section>

    </main>

    <div id="footer-placeholder"></div>

    <script>
        // Inicializa os ícones do Lucide nesta página externa
        lucide.createIcons();

        fetch('navbar.html')
            .then(resposta => resposta.text())
            .then(html => {
                // 1. Injeta o HTML do Navbar na página
                document.getElementById('navbar-placeholder').innerHTML = html;
                
                // 2. Imediatamente após carregar o navbar, busca o JSON
                return fetch('dados.json');
            })
            .then(resposta => resposta.json())
            .then(dados => {
                // 3. Monta o texto com o dado dinâmico do JSON
                // Assumindo que a chave no seu JSON se chame "mes_referencia"
                const textoIndex = `Gestão à Vista - Referência ${dados.mes_referencia}`;
                
                // 4. Injeta nos IDs do Navbar
                document.getElementById('nav-subtitle-desktop').innerText = textoIndex;
                document.getElementById('nav-subtitle-mobile').innerText = textoIndex;
            })
            .catch(erro => console.error("Erro ao carregar navbar ou JSON:", erro));

        fetch('footer.html')
            .then(resposta => resposta.text())
            .then(dados => {
              document.getElementById('footer-placeholder').innerHTML = dados;
        });
    </script>
</body>

</html>
